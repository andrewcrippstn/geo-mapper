<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoMapper</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Space Grotesk',sans-serif; background:#0f172a; color:#E2E8F0; overflow:hidden; height:100vh; }

        /* Header */
        #header {
            position:absolute; top:0; left:0; right:0; z-index:1100;
            background:rgba(13,18,36,0.97); backdrop-filter:blur(20px);
            border-bottom:1px solid rgba(59,130,246,0.2);
            padding:14px 24px; display:flex; align-items:center; gap:14px;
            box-shadow:0 4px 24px rgba(0,0,0,0.4);
        }
        .pulse-dot { width:8px;height:8px;border-radius:50%;background:#2563EB;box-shadow:0 0 10px #2563EB;animation:pulse 2s infinite;flex-shrink:0; }
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        h1 { font-size:22px;font-weight:700;background:linear-gradient(135deg,#60A5FA,#2563EB);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; }
        .status-badge { padding:5px 12px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:6px;color:#22C55E;font-weight:500;font-size:12px; }

        /* Panel */
        #controlPanel {
            position:absolute; top:70px; left:24px; z-index:1050;
            background:rgba(11,17,32,0.97); backdrop-filter:blur(20px);
            border:1px solid rgba(59,130,246,0.18); border-radius:12px;
            padding:18px; width:330px; max-height:calc(100vh - 96px);
            overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,0.6);
        }
        .cs { margin-bottom:18px; }
        .lbl { display:block;font-size:10px;font-weight:700;color:#4B5563;margin-bottom:7px;text-transform:uppercase;letter-spacing:.7px; }
        textarea.paste { width:100%;min-height:100px;padding:10px;background:rgba(30,41,59,.6);border:1px solid rgba(59,130,246,.3);border-radius:8px;color:#E2E8F0;font-size:12px;font-family:'Courier New',monospace;resize:vertical;transition:all .2s; }
        textarea.paste:focus { outline:none;border-color:#3B82F6;box-shadow:0 0 0 3px rgba(59,130,246,.1); }
        textarea.paste::placeholder { color:#374151; }
        .btn { width:100%;padding:10px;background:linear-gradient(135deg,#3B82F6,#2563EB);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(59,130,246,.3);font-family:'Space Grotesk',sans-serif;margin-top:9px; }
        .btn:hover { transform:translateY(-1px);box-shadow:0 6px 18px rgba(59,130,246,.4); }
        select { width:100%;padding:8px 10px;background:rgba(30,41,59,.6);border:1px solid rgba(59,130,246,.25);border-radius:6px;color:#E2E8F0;font-size:12px;cursor:pointer;font-family:'Space Grotesk',sans-serif; }
        select:focus { outline:none;border-color:#3B82F6; }
        select option { background:#1e293b; }
        .toggle { display:flex;align-items:center;gap:8px;margin-top:7px;cursor:pointer; }
        .toggle input { width:14px;height:14px;cursor:pointer;accent-color:#3B82F6; }
        .toggle label { font-size:12px;color:#94A3B8;cursor:pointer;margin:0; }
        .icon-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:5px; }
        .ib { padding:9px 5px;background:rgba(30,41,59,.4);border:1px solid rgba(59,130,246,.2);border-radius:5px;color:#CBD5E1;font-size:11px;cursor:pointer;transition:all .2s;font-weight:500;font-family:'Space Grotesk',sans-serif; }
        .ib.on { background:rgba(59,130,246,.2);border-color:#3B82F6;color:#fff; }
        .ib:hover { background:rgba(59,130,246,.12); }
        .cg { display:grid;grid-template-columns:repeat(4,1fr);gap:6px; }
        .cb { width:100%;height:34px;border:3px solid transparent;border-radius:5px;cursor:pointer;transition:all .2s; }
        .cb.on { border-color:#fff;box-shadow:0 0 12px var(--c); }
        .mg-label { font-size:10px;color:#374151;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px; }
        .mb { padding:9px 12px;background:rgba(30,41,59,.3);border:1px solid rgba(59,130,246,.15);border-radius:5px;color:#CBD5E1;font-size:12px;cursor:pointer;transition:all .2s;text-align:left;font-weight:500;font-family:'Space Grotesk',sans-serif;width:100%;display:block; }
        .mb.on { background:rgba(59,130,246,.2);border-color:#3B82F6;color:#fff; }
        .mb:hover { background:rgba(59,130,246,.1); }
        .hint { font-size:11px;color:#374151;margin-top:5px;line-height:1.5; }

        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:rgba(30,41,59,.3); }
        ::-webkit-scrollbar-thumb { background:rgba(59,130,246,.3);border-radius:3px; }

        /* Map */
        #map { width:100%;height:100vh; }
        .custom-marker { filter:drop-shadow(0 3px 6px rgba(0,0,0,.4)); }
        .marker-label { pointer-events:none;z-index:500; }

        /* ── Floating Legend ── */
        #floatingLegend {
            position:absolute; bottom:36px; right:24px; z-index:1080;
            background:#4B5563;
            border:none;
            border-radius:4px;
            padding:10px 13px; min-width:140px; max-width:210px;
            box-shadow:0 4px 16px rgba(0,0,0,.5);
            display:none; cursor:move; user-select:none;
        }
        .leg-title { font-size:10px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1px;margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.25); }
        .leg-item { display:flex;align-items:center;gap:8px;margin-bottom:6px; }
        .leg-swatch { width:16px;height:16px;border-radius:2px;border:1px solid rgba(255,255,255,.4);flex-shrink:0; }
        .leg-text { font-size:12px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500; }

        /* ── Selection Box ── */
        #selBox {
            position:absolute; display:none;
            border:3px solid #fff;
            background:rgba(59,130,246,.06);
            cursor:move;
            box-shadow:0 0 0 2px rgba(0,0,0,.5);
            z-index:900;
        }
        .rh {
            position:absolute; width:11px; height:11px;
            background:#fff; border:2px solid #3B82F6; border-radius:2px;
            box-shadow:0 1px 5px rgba(0,0,0,.4); z-index:901;
        }
        .rh-nw{top:-6px;left:-6px;cursor:nw-resize} .rh-ne{top:-6px;right:-6px;cursor:ne-resize}
        .rh-sw{bottom:-6px;left:-6px;cursor:sw-resize} .rh-se{bottom:-6px;right:-6px;cursor:se-resize}
        .rh-n{top:-6px;left:50%;transform:translateX(-50%);cursor:n-resize}
        .rh-s{bottom:-6px;left:50%;transform:translateX(-50%);cursor:s-resize}
        .rh-w{left:-6px;top:50%;transform:translateY(-50%);cursor:w-resize}
        .rh-e{right:-6px;top:50%;transform:translateY(-50%);cursor:e-resize}

        /* ── Loupe Window ── */
        #loupeWin {
            position:absolute; z-index:1065; display:none;
            width:380px; height:300px; right:24px; top:80px;
            border:none;
            border-radius:4px;
            overflow:hidden;
            box-shadow:0 8px 32px rgba(0,0,0,.7);
            background:#374151;
            cursor:move;
        }
        #loupeMapEl { width:100%; height:100%; }
        #loupeBar { display:none; }
        #loupeCls { display:none; }

        /* Instructions */
        #inst { position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#94A3B8;z-index:50;pointer-events:none; }
        .inst-icon { font-size:52px;margin-bottom:12px;opacity:.2; }
        .inst-t { font-size:17px;font-weight:600;margin-bottom:5px; }
        .inst-s { font-size:12px;opacity:.5; }
    </style>
</head>
<body>

<div id="header">
    <div class="pulse-dot"></div>
    <h1>GeoMapper</h1>
    <div style="flex:1"></div>
    <div id="statusBadge"></div>
</div>

<div id="controlPanel">
    <div class="cs">
        <label class="lbl">Paste Data from Excel</label>
        <textarea id="dataInput" class="paste" placeholder="Paste Excel/CSV data here (include header row)...

Example:
City	Latitude	Longitude	Type
London	51.5074	-0.1278	Capital"></textarea>
        <div class="hint">💡 Copy cells in Excel then paste here. Tabs or commas both work.</div>
        <button id="parseBtn" class="btn">Load Data</button>
    </div>
    <div id="dynCtrl"></div>
</div>

<div id="map"></div>

<!-- Selection box overlaid on map -->
<div id="selBox">
    <div class="rh rh-nw" data-d="nw"></div><div class="rh rh-ne" data-d="ne"></div>
    <div class="rh rh-sw" data-d="sw"></div><div class="rh rh-se" data-d="se"></div>
    <div class="rh rh-n"  data-d="n"></div> <div class="rh rh-s"  data-d="s"></div>
    <div class="rh rh-w"  data-d="w"></div> <div class="rh rh-e"  data-d="e"></div>
</div>

<!-- Floating close-up window -->
<div id="loupeWin">
    <div id="loupeBar"><span>🔍 Close-up</span><button id="loupeCls">✕</button></div>
    <div id="loupeMapEl"></div>
</div>

<!-- Floating legend -->
<div id="floatingLegend">
    <div class="leg-title" id="legTitle">Legend</div>
    <div id="legItems"></div>
</div>

<div id="inst">
    <div class="inst-icon">🗺️</div>
    <div class="inst-t">Paste Data to Begin</div>
    <div class="inst-s">Copy from Excel and paste into the panel</div>
</div>

<script>
// ══════════════════════════════════════
// CONFIG
// ══════════════════════════════════════

const ICONS = {
    'Classic Pin': c=>`<svg width="32" height="42" viewBox="0 0 32 42" xmlns="http://www.w3.org/2000/svg"><path d="M16 0C7.163 0 0 7.163 0 16c0 12 16 26 16 26s16-14 16-26C32 7.163 24.837 0 16 0z" fill="${c}" stroke="#fff" stroke-width="2"/><circle cx="16" cy="16" r="6" fill="#fff"/></svg>`,
    'Circle':      c=>`<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="${c}" stroke="#fff" stroke-width="2.5"/><circle cx="12" cy="12" r="4" fill="#fff"/></svg>`,
    'Diamond':     c=>`<svg width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg"><rect x="14" y="0" width="16" height="16" transform="rotate(45 14 14)" fill="${c}" stroke="#fff" stroke-width="2"/><circle cx="14" cy="14" r="4" fill="#fff"/></svg>`,
    'Star':        c=>`<svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg"><path d="M15 2l3.09 9.51h10l-8.09 5.88 3.09 9.51L15 21.02 6.91 26.9l3.09-9.51L1.91 11.51h10z" fill="${c}" stroke="#fff" stroke-width="1.5"/><circle cx="15" cy="15" r="3" fill="#fff"/></svg>`,
    'Square':      c=>`<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="20" height="20" rx="2" fill="${c}" stroke="#fff" stroke-width="2.5"/><rect x="8" y="8" width="8" height="8" rx="1" fill="#fff"/></svg>`
};
const ANCHORS = {
    'Classic Pin':{ iconSize:[32,42],iconAnchor:[16,42],popupAnchor:[0,-42] },
    'Circle':     { iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-12] },
    'Diamond':    { iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-14] },
    'Star':       { iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-15] },
    'Square':     { iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-12] }
};

const MAP_GROUPS = [
    { g:'Standard', maps:[
        {n:'Street Map',       url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',attr:'© OpenStreetMap'},
        {n:'Satellite',        url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',attr:'© Esri'},
        {n:'Topo',             url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',attr:'© OpenTopoMap'},
    ]},
    { g:'Minimal / Clean', maps:[
        {n:'Light',            url:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',attr:'© CARTO'},
        {n:'Voyager',          url:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',attr:'© CARTO'},
        {n:'Positron No Labels',url:'https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',attr:'© CARTO'},
    ]},
    { g:'Dark', maps:[
        {n:'Dark',             url:'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',attr:'© CARTO'},
        {n:'Dark No Labels',   url:'https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',attr:'© CARTO'},
    ]},
    { g:'Black & White', maps:[
        {n:'Toner High Contrast',url:'https://stamen-tiles-{s}.a.ssl.fastly.net/toner/{z}/{x}/{y}.png',attr:'© Stamen Design'},
        {n:'Toner Lite',       url:'https://stamen-tiles-{s}.a.ssl.fastly.net/toner-lite/{z}/{x}/{y}.png',attr:'© Stamen Design'},
        {n:'B&W Background',   url:'https://stamen-tiles-{s}.a.ssl.fastly.net/toner-background/{z}/{x}/{y}.png',attr:'© Stamen Design'},
    ]},
    { g:'Artistic', maps:[
        {n:'Watercolor',       url:'https://watercolormaps.collection.cooperhewitt.org/tile/watercolor/{z}/{x}/{y}.jpg',attr:'© Stamen Design'},
        {n:'Humanitarian',     url:'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',attr:'© OpenStreetMap'},
    ]}
];
const ALL_MAPS = MAP_GROUPS.flatMap(g=>g.maps);

const COLORS = [
    {n:'Electric Blue',v:'#0066FF'},{n:'Sunset Orange',v:'#FF6B35'},
    {n:'Emerald',v:'#00D9A3'},{n:'Royal Purple',v:'#8B5CF6'},
    {n:'Crimson',v:'#DC2626'},{n:'Golden',v:'#F59E0B'},
    {n:'Cyan',v:'#06B6D4'},{n:'Magenta',v:'#EC4899'},
    {n:'Lime',v:'#84CC16'},{n:'Rose',v:'#F43F5E'},
    {n:'Sky',v:'#38BDF8'},{n:'Amber',v:'#D97706'},
];

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let map=null, tile=null, loupeMap=null, loupeTile=null;
let markers=[], loupeMarkers=[];
let csvData=null, headers=[];
let labelField='', mapIdx=0, iconType='Classic Pin', markerColor='#0066FF';
let showLabels=false, groupField='', colorGroups={};
let loupeOn=false;

// ══════════════════════════════════════
// PARSE
// ══════════════════════════════════════
function parseData(txt){
    const lines=txt.trim().split('\n').filter(l=>l.trim());
    if(lines.length<2)return null;
    const d=lines[0].includes('\t')?'\t':',';
    const h=lines[0].split(d).map(x=>x.trim().replace(/^"|"$/g,''));
    const data=lines.slice(1).map(line=>{
        const v=line.split(d).map(x=>x.trim().replace(/^"|"$/g,''));
        const row={};h.forEach((k,i)=>row[k]=v[i]||'');
        return row;
    }).filter(r=>Object.values(r).some(v=>v));
    return {headers:h,data};
}

// ══════════════════════════════════════
// COLOR GROUPS
// ══════════════════════════════════════
function genGroups(field){
    colorGroups={};
    if(!field||!csvData)return;
    [...new Set(csvData.map(r=>r[field]))].filter(Boolean)
        .forEach((v,i)=>colorGroups[v]=COLORS[i%COLORS.length].v);
}
function getColor(row){ return groupField&&colorGroups[row[groupField]]||markerColor; }

// ══════════════════════════════════════
// LEGEND
// ══════════════════════════════════════
function updateLegend(){
    const el=document.getElementById('floatingLegend');
    if(!groupField||!Object.keys(colorGroups).length){el.style.display='none';return;}
    document.getElementById('legTitle').textContent='LEGEND';
    document.getElementById('legItems').innerHTML=Object.entries(colorGroups)
        .map(([v,c])=>`<div class="leg-item"><div class="leg-swatch" style="background:${c}"></div><span class="leg-text" title="${v}">${v}</span></div>`)
        .join('');
    el.style.display='block';
}

// Make legend draggable
;(function(){
    const el=document.getElementById('floatingLegend');
    let dr=false,ox=0,oy=0;
    el.addEventListener('mousedown',e=>{const r=el.getBoundingClientRect();dr=true;ox=e.clientX-r.left;oy=e.clientY-r.top;e.preventDefault();});
    document.addEventListener('mousemove',e=>{if(!dr)return;el.style.right='auto';el.style.bottom='auto';el.style.left=(e.clientX-ox)+'px';el.style.top=(e.clientY-oy)+'px';});
    document.addEventListener('mouseup',()=>dr=false);
})();

// ══════════════════════════════════════
// MAP INIT
// ══════════════════════════════════════
function initMap(){
    map=L.map('map',{center:[20,0],zoom:2});
    tile=L.tileLayer(ALL_MAPS[mapIdx].url,{attribution:ALL_MAPS[mapIdx].attr,maxZoom:18}).addTo(map);
    map.on('moveend zoomend',()=>{ if(loupeOn)syncLoupe(); });
}
function initLoupeMap(){
    if(loupeMap)return;
    loupeMap=L.map('loupeMapEl',{center:[20,0],zoom:5,zoomControl:false,attributionControl:false});
    loupeTile=L.tileLayer(ALL_MAPS[mapIdx].url,{maxZoom:18}).addTo(loupeMap);
}
function updateTiles(){
    [map,loupeMap].forEach((m,i)=>{
        if(!m)return;
        m.eachLayer(l=>{if(l instanceof L.TileLayer)m.removeLayer(l);});
        const nl=L.tileLayer(ALL_MAPS[mapIdx].url,{attribution:ALL_MAPS[mapIdx].attr,maxZoom:18}).addTo(m);
        if(i===0)tile=nl; else loupeTile=nl;
    });
}

// ══════════════════════════════════════
// MARKERS
// ══════════════════════════════════════
function findLatLon(){
    const lat=headers.find(h=>/^lat(itude)?$/i.test(h.trim()));
    const lon=headers.find(h=>/^lo?ng?(itude)?$/i.test(h.trim()));
    return{lat,lon};
}
function makeIcon(row){
    const c=getColor(row),a=ANCHORS[iconType];
    return L.divIcon({html:ICONS[iconType](c),className:'custom-marker',iconSize:a.iconSize,iconAnchor:a.iconAnchor,popupAnchor:a.popupAnchor});
}
function makeLabel(text,color,halfH){
    return L.divIcon({
        html:`<div style="background:rgba(11,17,32,.92);color:#f1f5f9;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.5);border:1px solid ${color};font-family:'Space Grotesk',sans-serif;">${text}</div>`,
        className:'marker-label',iconSize:null,iconAnchor:[-14,halfH]
    });
}
function makePopup(row,latC,lonC,color){
    let h=`<div style="font-family:'Space Grotesk',sans-serif;min-width:130px;padding:2px;">`;
    if(labelField&&row[labelField])h+=`<strong style="font-size:13px;color:${color}">${row[labelField]}</strong><br>`;
    headers.forEach(k=>{if(k!==latC&&k!==lonC&&row[k])h+=`<span style="font-size:11px"><b>${k}:</b> ${row[k]}</span><br>`;});
    return h+'</div>';
}
function clearMarkers(m,list){list.forEach(mk=>m.removeLayer(mk));list.length=0;}

function populateMap(target,outList,withPopups){
    if(!target||!csvData)return[];
    const {lat:latC,lon:lonC}=findLatLon();
    if(!latC||!lonC)return[];
    const bounds=[];
    const isLoupe = (target === loupeMap);
    csvData.forEach(row=>{
        const lat=parseFloat(row[latC]),lon=parseFloat(row[lonC]);
        if(isNaN(lat)||isNaN(lon))return;
        bounds.push([lat,lon]);
        const color=getColor(row);
        const mk=L.marker([lat,lon],{icon:makeIcon(row)}).addTo(target);
        if(withPopups) mk.bindPopup(makePopup(row,latC,lonC,color));
        outList.push(mk);
        // Both main map and loupe respect the showLabels toggle
        const doLabel = showLabels && labelField && row[labelField];
        if(doLabel){
            const a=ANCHORS[iconType];
            const lm=L.marker([lat,lon],{icon:makeLabel(row[labelField],color,a.iconSize[1]/2),interactive:false}).addTo(target);
            outList.push(lm);
        }
    });
    return bounds;
}

function updateMarkers(){
    clearMarkers(map,markers);
    if(loupeMap)clearMarkers(loupeMap,loupeMarkers);
    if(!csvData)return;
    const bounds=populateMap(map,markers,true);
    if(loupeMap)populateMap(loupeMap,loupeMarkers,false);
    if(bounds.length)map.fitBounds(bounds,{padding:[50,50]});
    updateLegend();
    document.getElementById('statusBadge').innerHTML=`<div class="status-badge">${csvData.length} points loaded</div>`;
}

// ══════════════════════════════════════
// LOUPE
// ══════════════════════════════════════
const selBox=document.getElementById('selBox');
let SX=160,SY=120,SW=200,SH=150; // box pos/size in map px
let sDrag=false,sResize=false,sDir=null,sMx=0,sMy=0,s0X=0,s0Y=0,s0W=0,s0H=0;

function applyBox(){
    const r=document.getElementById('map').getBoundingClientRect();
    SW=Math.max(80,Math.min(SW,r.width-SX));
    SH=Math.max(60,Math.min(SH,r.height-SY));
    SX=Math.max(0,Math.min(SX,r.width-SW));
    SY=Math.max(0,Math.min(SY,r.height-SH));
    selBox.style.cssText+=`;left:${SX}px;top:${SY}px;width:${SW}px;height:${SH}px;`;
}

function syncLoupe(){
    if(!loupeMap||!loupeOn)return;
    const tl=map.containerPointToLatLng([SX,SY]);
    const br=map.containerPointToLatLng([SX+SW,SY+SH]);
    loupeMap.fitBounds(L.latLngBounds(br,tl),{animate:false});
}

function enableLoupe(){
    loupeOn=true;
    initLoupeMap();
    clearMarkers(loupeMap,loupeMarkers);
    populateMap(loupeMap,loupeMarkers,false);
    const r=document.getElementById('map').getBoundingClientRect();
    SX=Math.round(r.width*.38);SY=Math.round(r.height*.28);SW=200;SH=150;
    selBox.style.display='block';
    applyBox();
    const lw=document.getElementById('loupeWin');
    lw.style.cssText='display:block;right:24px;top:80px;bottom:auto;left:auto;';
    setTimeout(()=>{loupeMap.invalidateSize();syncLoupe();},60);
}
function disableLoupe(){
    loupeOn=false;
    selBox.style.display='none';
    document.getElementById('loupeWin').style.display='none';
    if(loupeMap)clearMarkers(loupeMap,loupeMarkers);
    const cb=document.getElementById('loupeToggle');
    if(cb)cb.checked=false;
}

// Box drag
selBox.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('rh'))return;
    e.preventDefault();e.stopPropagation();
    map.dragging.disable();
    sDrag=true;sMx=e.clientX;sMy=e.clientY;s0X=SX;s0Y=SY;
});
selBox.querySelectorAll('.rh').forEach(h=>h.addEventListener('mousedown',e=>{
    e.preventDefault();e.stopPropagation();
    map.dragging.disable();
    sResize=true;sDir=e.target.dataset.d;
    sMx=e.clientX;sMy=e.clientY;s0X=SX;s0Y=SY;s0W=SW;s0H=SH;
}));
document.addEventListener('mousemove',e=>{
    if(!sDrag&&!sResize)return;
    const dx=e.clientX-sMx,dy=e.clientY-sMy;
    if(sDrag){SX=s0X+dx;SY=s0Y+dy;}
    else{
        const d=sDir;
        if(d.includes('e'))SW=Math.max(80,s0W+dx);
        if(d.includes('s'))SH=Math.max(60,s0H+dy);
        if(d.includes('w')){SX=s0X+dx;SW=Math.max(80,s0W-dx);}
        if(d.includes('n')){SY=s0Y+dy;SH=Math.max(60,s0H-dy);}
    }
    applyBox();syncLoupe();
});
document.addEventListener('mouseup',()=>{
    if(sDrag||sResize){sDrag=false;sResize=false;map.dragging.enable();}
});

// Loupe window drag
;(function(){
    const lw=document.getElementById('loupeWin');
    let dr=false,ox=0,oy=0;
    lw.addEventListener('mousedown',e=>{
        // Only drag if not interacting with the map itself
        if(e.target.closest('.leaflet-interactive')||e.target.closest('.leaflet-control'))return;
        const r=lw.getBoundingClientRect();dr=true;ox=e.clientX-r.left;oy=e.clientY-r.top;e.preventDefault();
    });
    document.addEventListener('mousemove',e=>{if(!dr)return;lw.style.right='auto';lw.style.bottom='auto';lw.style.left=(e.clientX-ox)+'px';lw.style.top=(e.clientY-oy)+'px';if(loupeMap)loupeMap.invalidateSize();});
    document.addEventListener('mouseup',()=>dr=false);
})();
document.getElementById('loupeCls').addEventListener('click',disableLoupe);

// ══════════════════════════════════════
// CONTROLS
// ══════════════════════════════════════
function renderControls(){
    const mapHTML=MAP_GROUPS.map(g=>`
        <div class="mg-label">${g.g}</div>
        ${g.maps.map(m=>{const i=ALL_MAPS.indexOf(m);return`<button class="mb ${i===mapIdx?'on':''}" data-i="${i}">${m.n}</button>`;}).join('')}
    `).join('');

    document.getElementById('dynCtrl').innerHTML=`
        <div class="cs">
            <label class="lbl">Point Label</label>
            <select id="lblSel">${headers.map(h=>`<option value="${h}" ${h===labelField?'selected':''}>${h}</option>`).join('')}</select>
            <div class="toggle"><input type="checkbox" id="showLblCk" ${showLabels?'checked':''}><label for="showLblCk">Show labels on map</label></div>
        </div>
        <div class="cs">
            <label class="lbl">Color by Category</label>
            <select id="grpSel"><option value="">None (single color)</option>${headers.map(h=>`<option value="${h}" ${h===groupField?'selected':''}>${h}</option>`).join('')}</select>
        </div>
        ${!groupField?`<div class="cs"><label class="lbl">Marker Color</label><div class="cg">${COLORS.map(c=>`<button class="cb ${c.v===markerColor?'on':''}" style="background:${c.v};--c:${c.v}" data-c="${c.v}" title="${c.n}"></button>`).join('')}</div></div>`:''}
        <div class="cs">
            <label class="lbl">Marker Style</label>
            <div class="icon-grid">${Object.keys(ICONS).map(k=>`<button class="ib ${k===iconType?'on':''}" data-k="${k}">${k}</button>`).join('')}</div>
        </div>
        <div class="cs">
            <label class="lbl">Close-up View</label>
            <div class="toggle"><input type="checkbox" id="loupeToggle" ${loupeOn?'checked':''}><label for="loupeToggle">Enable close-up loupe</label></div>
            <div class="hint" style="margin-top:6px">Drag the selection box on the map to pick the area. Drag the close-up window to reposition it.</div>
        </div>
        <div class="cs">
            <label class="lbl">Map Style</label>
            <div>${mapHTML}</div>
        </div>
    `;

    document.getElementById('lblSel').onchange=e=>{labelField=e.target.value;updateMarkers();};
    document.getElementById('showLblCk').onchange=e=>{showLabels=e.target.checked;updateMarkers();};
    document.getElementById('grpSel').onchange=e=>{groupField=e.target.value;if(groupField)genGroups(groupField);renderControls();updateMarkers();};
    document.getElementById('loupeToggle').onchange=e=>{if(e.target.checked)enableLoupe();else disableLoupe();};
    document.querySelectorAll('.ib').forEach(b=>b.addEventListener('click',e=>{
        iconType=e.currentTarget.dataset.k;
        document.querySelectorAll('.ib').forEach(x=>x.classList.remove('on'));
        e.currentTarget.classList.add('on');updateMarkers();
    }));
    document.querySelectorAll('.cb').forEach(b=>b.addEventListener('click',e=>{
        markerColor=e.currentTarget.dataset.c;
        document.querySelectorAll('.cb').forEach(x=>x.classList.remove('on'));
        e.currentTarget.classList.add('on');updateMarkers();
    }));
    document.querySelectorAll('.mb').forEach(b=>b.addEventListener('click',e=>{
        mapIdx=parseInt(e.currentTarget.dataset.i);
        document.querySelectorAll('.mb').forEach(x=>x.classList.remove('on'));
        e.currentTarget.classList.add('on');updateTiles();
        if(loupeOn)setTimeout(syncLoupe,200);
    }));
}

// ══════════════════════════════════════
// PARSE BUTTON
// ══════════════════════════════════════
document.getElementById('parseBtn').addEventListener('click',()=>{
    const input=document.getElementById('dataInput').value;
    if(!input.trim()){alert('Please paste some data first!');return;}
    const res=parseData(input);
    if(!res||!res.data.length){alert('Could not parse data. Please check format.');return;}
    csvData=res.data; headers=res.headers; labelField=headers[0];
    groupField=''; colorGroups={};
    document.getElementById('inst').style.display='none';
    const {lat,lon}=findLatLon();
    if(!lat||!lon) alert(`Heads up: could not find Latitude/Longitude columns automatically.\nFound: ${headers.join(', ')}\nColumn names should contain "lat" and "lon" (or "lng").`);
    renderControls();
    updateMarkers();
});

window.addEventListener('load',initMap);
</script>
